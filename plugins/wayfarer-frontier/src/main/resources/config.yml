config-version: 1
runtime-role: FRONTIER

themes:
  worlds-beyond:
    enabled: true
    worlds:
      allowlist: [frontier_iris]
    portals:
      nether: DENY
      end: DENY
      cross-theme-fallback: DENY

    loadout:
      initial-launchpad-amount: 2
      initial-grant-once: true
      reissue-launchpad-on-loss: false

    leafgrapple:
      expected-version: 1.0.2

    shop:
      launchpad: { price-wm: 30, amount: 1 }
      firework-rocket: { price-wm: 200, amount: 1, flight-duration: 3 }

    launchpad:
      material: LIGHT_WEIGHTED_PRESSURE_PLATE
      disable-while-sneaking: true
      max-successful-uses: 3
      horizontal-velocity: 2.5
      vertical-velocity: 1.2
      auto-deploy-elytra: true
      use-cooldown-seconds: 2
      expire-after-days: 30
      extend-expiration-on-use: true
      allow-player-break: true
      drop-on-player-break: false
      max-active-per-player: 0

    navigation:
      waystone: DEFERRED_BY_REQUIREMENT

persistence:
  # ADR 0009 approved: these are secret references, never credentials.
  jdbc-url-ref: WAYFARER_DB_URL
  username-ref: WAYFARER_DB_USERNAME
  password-ref: WAYFARER_DB_PASSWORD
  maximum-pool-size: 3
  minimum-idle: 0
  connection-timeout-millis: 5000

checkpoint:
  interval-seconds: 300
  disable-timeout-seconds: 15

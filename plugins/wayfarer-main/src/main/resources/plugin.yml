name: Wayfarer_Main
version: '${version}'
main: io.github.eariver.wayfarer.main.WayfarerMainPlugin
api-version: '1.21.11'
description: Project Wayfarer Main gameplay
author: eariver
depend: [Wayfarer_Core]
commands:
  wayfarer-main:
    description: Wayfarer Main administration and tool status
    usage: /wayfarer-main <status|tool reissue [confirm]|inspect|grant|reissue|repair|branch|revoke|reconcile|delivery>
    aliases: [wfmain]
permissions:
  wayfarer.main.use:
    description: Use the bound Growth Tool interface
    default: true
  wayfarer.main.admin.*:
    description: Manage all Wayfarer Main administrative routes
    default: op
    children:
      wayfarer.main.admin.read: true
      wayfarer.main.admin.delivery: true
      wayfarer.main.admin.modify: true
      wayfarer.main.admin.reconcile: true
  wayfarer.main.admin.read:
    description: Read Wayfarer Main status and administrative records
    default: false
  wayfarer.main.admin.delivery:
    description: Retry and restore Wayfarer Main deliveries
    default: false
  wayfarer.main.admin.modify:
    description: Modify or revoke Wayfarer Main tool authority
    default: false
  wayfarer.main.admin.reconcile:
    description: Reconcile Wayfarer Main repair and reissue recovery
    default: false
  wayfarer.main.debug:
    description: Use explicitly enabled Wayfarer Main debug commands
    default: op

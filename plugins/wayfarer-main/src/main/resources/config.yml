config-version: 1
runtime-role: MAIN

worlds:
  progress-allowlist: [resource, resource_nether, resource_end]

progress:
  scale: 1000
  fallback-weight: 1.0
  weights:
    COBBLESTONE: 0.25
    COBBLED_DEEPSLATE: 0.35
    STONE: 1.0
    GRANITE: 1.0
    DIORITE: 1.0
    ANDESITE: 1.0
    TUFF: 1.0
    CALCITE: 1.0
    NETHERRACK: 1.0
    BLACKSTONE: 1.0
    BASALT: 1.0
    SMOOTH_BASALT: 1.0
    DEEPSLATE: 1.25
    END_STONE: 1.25
    OBSIDIAN: 2.0
    CRYING_OBSIDIAN: 2.0
  ore-multipliers:
    COAL: 1.50
    NETHER_QUARTZ: 1.50
    COPPER: 1.60
    REDSTONE: 1.75
    IRON: 2.00
    LAPIS: 2.10
    NETHER_GOLD: 2.00
    GOLD: 2.50
    DIAMOND: 3.50
    EMERALD: 4.00
    ANCIENT_DEBRIS: 4.00

evolution:
  material-thresholds:
    stone: 100
    iron: 400
    diamond: 1200
  enchant-progression:
    base: 800
    linear: 200
    quadratic: 40
  caps:
    efficiency: 10
    unbreaking: 10
    fortune: 5
    silk-touch: 1

repair:
  base-cost-wm: 100
  evolution-multiplier-per-step: 0.08
  minimum-charge-ratio: 0.25
  broken:
    flat-surcharge-wm: 100
    surcharge-per-evolution: 5

checkpoint:
  interval-seconds: 300
  disable-timeout-seconds: 15

persistence:
  # ADR 0009 remains PLUGIN_REVIEW_REQUIRED. These are secret references, never credentials.
  jdbc-url-ref: WAYFARER_DB_URL
  username-ref: WAYFARER_DB_USERNAME
  password-ref: WAYFARER_DB_PASSWORD
  maximum-pool-size: 3
  minimum-idle: 0
  connection-timeout-millis: 5000

debug-commands:
  enabled: false

name: Wayfarer_Core
version: '${version}'
main: io.github.eariver.wayfarer.core.WayfarerCorePlugin
api-version: '1.21.11'
description: Project Wayfarer shared plugin infrastructure
author: eariver
softdepend: [Vault, RedisEconomy, LuckPerms]
commands:
  wayfarer:
    description: Project Wayfarer administration command
    usage: /wayfarer admin health
permissions:
  wayfarer.admin.health:
    description: View sanitized Wayfarer_Core health
    default: op
  wayfarer.admin.transaction.inspect:
    description: Inspect sanitized Wayfarer_Core transaction state
    default: op
  wayfarer.admin.transaction.reconcile:
    description: Reconcile an uncertain Wayfarer_Core transaction with confirmation
    default: op

# TEST-ONLY LeafGrapple 1.0.2 handoff fixture; do not apply to Project Runtime.
# Source artifact version: plugin.yml 1.0.2; embedded Maven version: 1.0.2-SNAPSHOT.
# Source artifact SHA-256: FFE4B3305BB48737E1B6C373698FEFE7121B879FD5B9399F930F5023B5F78833.
# All non-safety values are copied exactly from the reviewed hooks.wood tier.
# This fixture is not a production balance recommendation.
hooks:
  wayfarer:
    display-name: "Wood Grapple"

    # 手持物品材质
    item-material: PAPER
    item-model: "leafgrapple:wood_grapple"

    # 飞出去的钩头显示
    display-item-material: PAPER
    display-item-model: "leafgrapple:wood_grapple_head"

    # 钩爪发射最大距离
    max-distance: 16.0

    # 玩家右键拉回时，玩家与拉扯目标点之间允许的最大距离
    # <= 0 表示不限制
    max-pull-distance: 32.0

    launch-speed: 1.2
    pull-acceleration: 0.05
    max-pull-speed: 0.85
    cooldown-ticks: 20

    durability:
      enabled: false       # 是否启用耐久
      max: 32            # 最大耐久
      cost-on-finish: 1   # 成功拉回完成后扣多少耐久

    display:
      glowing: true

      # ItemDisplay 缩放
      scale-x: 0.35
      scale-y: 0.35
      scale-z: 0.35

      # ItemDisplay 本地偏移
      offset-x: 0.0
      offset-y: -0.1
      offset-z: 0.0

      # 简单轴角旋转
      # angle 是角度制，不是弧度
      rotation-axis-x: 0.0
      rotation-axis-y: 1.0
      rotation-axis-z: 0.0
      rotation-angle-degrees: 0.0

    lore:
      show-technical-info: false

    entity-hook:
      enabled: false

      target:
        # 是否允许钩玩家，建议默认 false
        players: false

        # mobs=true 表示允许所有非玩家 LivingEntity
        mobs: false

        # 如果 mobs=false，可以用 animals/monsters 更细分
        animals: false
        monsters: false

      pvp:
        # 如果 players=true，是否要求世界 PVP 开启
        require-world-pvp: true

        # 拥有该权限的玩家不会被实体钩爪束缚
        bypass-permission: "leafgrapple.entityhook.bypass"

      # 束缚持续时间
      duration-ticks: 40

      # 实体命中最大距离，默认可以和 max-distance 一致
      max-hit-distance: 16.0

      # 目标离锚点超过这个距离则断开
      break-distance: 12.0

      bind:
        # 目标可自由活动半径
        radius: 2.5

        # 超出半径后的回拉力度
        pull-strength: 0.10

        # 回拉速度上限
        max-pull-speed: 0.35

        # 速度阻尼，越小束缚感越强
        velocity-damping: 0.8

      damage:
        enabled: true
        amount: 2.0
        interval-ticks: 20

      particles:
        enabled: true
        interval-ticks: 1
        particle: ELECTRIC_SPARK
        count: 1
        step: 0.35
        max-points: 48

      visual:
        hook-display:
          enabled: true
          material: CHAIN
          glowing: true
          scale: 0.45

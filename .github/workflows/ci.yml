name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"
      - name: Check
        run: ./gradlew --no-daemon check
      - name: Assemble
        run: ./gradlew --no-daemon assemble
      - name: Reuse configuration cache
        run: ./gradlew --no-daemon --configuration-cache check assemble
      - name: Verify Core packaging
        shell: bash
        run: |
          mapfile -t core_jars < <(find plugins/wayfarer-core/build/libs -maxdepth 1 -type f -name '*.jar')
          echo "Core JAR count: ${#core_jars[@]}"
          printf 'Core JAR: %s\n' "${core_jars[@]}"
          test "${#core_jars[@]}" -eq 1
          core_jar="${core_jars[0]}"
          jar tf "$core_jar" > core-jar-entries.txt

          for migration in \
            db/migration/core/V001__core_schema.sql \
            db/migration/core/V002__core_identity_schema.sql \
            db/migration/core/V003__core_transaction_history.sql
          do
            migration_count="$(awk -v target="$migration" '$0 == target { count++ } END { print count + 0 }' core-jar-entries.txt)"
            echo "$migration count: $migration_count"
            test "$migration_count" -eq 1
          done

          if grep -Eq \
            '(^|/)(src/test|test-results|org/junit|org/testcontainers|com/github/dockerjava)(/|$)|^io/github/eariver/wayfarer/(main|frontier)/|(^|/)(application|runtime|server)\.(yml|yaml|properties)$' \
            core-jar-entries.txt
          then
            echo "Forbidden test, Docker, sibling-plugin, or runtime configuration entry found"
            exit 1
          fi

          duplicate_api_count="$(
            awk '/^io\/github\/eariver\/wayfarer\/api\/.*\.class$/ {
                   count[$0]++
                 }
                 END {
                   duplicates = 0
                   for (entry in count) {
                     if (count[entry] > 1) {
                       duplicates++
                     }
                   }
                   print duplicates
                 }' core-jar-entries.txt
          )"
          license_count="$(awk '/^META-INF\/(LICENSE|LICENSE\.txt|NOTICE)$/ { count++ } END { print count + 0 }' core-jar-entries.txt)"
          echo "Duplicate API class count: $duplicate_api_count"
          echo "License/notice entry count: $license_count"
          test "$duplicate_api_count" -eq 0
          test "$license_count" -ge 1

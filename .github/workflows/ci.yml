name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test stable release input and document gates
        shell: bash
        env:
          INPUT_VERSION: V0.0.1
          RELEASE_SCOPE: core
          STABLE_SOURCE_COMMIT: 49e00e21716c1c13a2dbb170fdad1b19c4275612
          TEST_EVIDENCE: docs/testing/results/V0.0.1-stable-local-acceptance.md
          MAIN_SERVER_INSTRUCTION: docs/requirements/main-server/Project-Wayfarer-V0.1.0/Project_Wayfarer_Plugin_Implementation_Test_Release_and_Mainline_Handoff_Requirements.md
          REQUIREMENT_TRACEABILITY: docs/requirements/main-server/Project-Wayfarer-V0.1.0/traceability.md
          RELEASE_READINESS: docs/handoff/V0.0.1/release-readiness.md
          REQUIREMENTS_CLEARED: "true"
        run: |
          git fetch origin main --no-tags
          bash scripts/release/test-stable-release-validation.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"
      - name: Check
        run: ./gradlew --no-daemon clean check
      - name: Assemble
        run: ./gradlew --no-daemon clean assemble
      - name: Configuration-cache check and reuse
        run: |
          ./gradlew --no-daemon --configuration-cache check
          ./gradlew --no-daemon --configuration-cache check
      - name: Configuration-cache assemble and reuse
        run: |
          ./gradlew --no-daemon --configuration-cache assemble
          ./gradlew --no-daemon --configuration-cache assemble
      - name: Verify reproducible Core runtime JAR
        shell: bash
        run: |
          first_jar="$(
            find plugins/wayfarer-core/build/libs -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              -print -quit
          )"
          first_hash="$(sha256sum "$first_jar" | awk '{ print $1 }')"
          ./gradlew --no-daemon clean :plugins:wayfarer-core:shadowJar
          second_jar="$(
            find plugins/wayfarer-core/build/libs -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              -print -quit
          )"
          second_hash="$(sha256sum "$second_jar" | awk '{ print $1 }')"
          echo "First Core SHA-256:  $first_hash"
          echo "Second Core SHA-256: $second_hash"
          test "$first_hash" = "$second_hash"
      - name: Verify Core packaging
        shell: bash
        run: |
          mapfile -t core_runtime_jars < <(
            find plugins/wayfarer-core/build/libs -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar'
          )
          echo "Core runtime JAR count: ${#core_runtime_jars[@]}"
          printf 'Core runtime JAR: %s\n' "${core_runtime_jars[@]}"
          test "${#core_runtime_jars[@]}" -eq 1
          core_jar="${core_runtime_jars[0]}"
          jar tf "$core_jar" > core-jar-entries.txt

          for migration in \
            db/migration/core/V001__core_schema.sql \
            db/migration/core/V002__core_identity_schema.sql \
            db/migration/core/V003__core_transaction_history.sql
          do
            migration_count="$(awk -v target="$migration" '$0 == target { count++ } END { print count + 0 }' core-jar-entries.txt)"
            echo "$migration count: $migration_count"
            test "$migration_count" -eq 1
          done

          v001_hash="$(unzip -p "$core_jar" db/migration/core/V001__core_schema.sql | sha256sum | awk '{ print $1 }')"
          v002_hash="$(unzip -p "$core_jar" db/migration/core/V002__core_identity_schema.sql | sha256sum | awk '{ print $1 }')"
          v003_hash="$(unzip -p "$core_jar" db/migration/core/V003__core_transaction_history.sql | sha256sum | awk '{ print $1 }')"
          echo "V001 SHA-256: $v001_hash"
          echo "V002 SHA-256: $v002_hash"
          echo "V003 SHA-256: $v003_hash"
          test "$v001_hash" = "59035d3bf0ee9f11e2a6756138fa55f331dc79546778c473bacbde887a894840"
          test "$v002_hash" = "b45709e7740a4e720b05c26ed02e66e965784980898eab29445b1293b422f260"
          test "$v003_hash" = "83483e0494b687ec4ff11af7872ae89e1406bb678ae2b000897fc66ff7a048b4"

          if grep -Eq \
            '(^|/)(src/test|test-results|org/junit|org/testcontainers|com/github/dockerjava|io/github/eariver/wayfarer/testkit|fixture)(/|$)|^io/github/eariver/wayfarer/(main|frontier)/|(^|/)(application|runtime|server)\.(yml|yaml|properties)$|^(\.env|secrets?[^/]*|worlds?|logs?|cache|runtime-data|database)(/|$)|\.(db|sqlite|sql\.dump|log)$' \
            core-jar-entries.txt
          then
            echo "Forbidden fixture, test, Docker, sibling-plugin, secret, or runtime-data entry found"
            exit 1
          fi

          duplicate_api_count="$(
            awk '/^io\/github\/eariver\/wayfarer\/api\/.*\.class$/ {
                   count[$0]++
                 }
                 END {
                   duplicates = 0
                   for (entry in count) {
                     if (count[entry] > 1) {
                       duplicates++
                     }
                   }
                   print duplicates
                 }' core-jar-entries.txt
          )"
          license_count="$(awk '/^META-INF\/(LICENSE|LICENSE\.txt|NOTICE)$/ { count++ } END { print count + 0 }' core-jar-entries.txt)"
          echo "Duplicate API class count: $duplicate_api_count"
          echo "License/notice entry count: $license_count"
          test "$duplicate_api_count" -eq 0
          test "$license_count" -ge 1

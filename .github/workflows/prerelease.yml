name: Create Test-Server Pre-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version with uppercase V (example: V0.0.1-alpha.1)"
        required: true
        type: string
      release_scope:
        description: "Artifact set included in this release"
        required: true
        type: choice
        options:
          - core
          - core-main
          - core-frontier
          - all
        default: core
      test_instructions:
        description: "Optional Markdown path or commit-pinned URL for test-server verification"
        required: false
        type: string

permissions: {}

concurrency:
  group: prerelease-${{ inputs.version }}-${{ inputs.release_scope }}
  cancel-in-progress: false

jobs:
  build:
    name: Build test-server candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    outputs:
      release_version: ${{ steps.metadata.outputs.release_version }}
      gradle_version: ${{ steps.metadata.outputs.gradle_version }}
      tag: ${{ steps.metadata.outputs.tag }}
      release_scope: ${{ steps.metadata.outputs.release_scope }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}

    steps:
      - name: Check out selected main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release request
        id: metadata
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_SCOPE: ${{ inputs.release_scope }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run this workflow from the main branch."
            exit 1
          fi

          if [[ ! "$INPUT_VERSION" =~ ^V[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z][0-9A-Za-z.-]*$ ]]; then
            echo "::error::Pre-release version must resemble V0.0.1-alpha.1."
            exit 1
          fi

          if [[ "$RELEASE_SCOPE" != "core" ]]; then
            echo "::error::The V0.0.1 release line permits only release_scope=core."
            exit 1
          fi

          RELEASE_VERSION="$INPUT_VERSION"
          GRADLE_VERSION="${INPUT_VERSION#V}"
          TAG="$INPUT_VERSION"
          ARTIFACT_NAME="prerelease-$RELEASE_VERSION-$RELEASE_SCOPE"

          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_SHA="$(git rev-list -n 1 "$TAG")"
            if [[ "$TAG_SHA" != "$GITHUB_SHA" ]]; then
              echo "::error::Existing tag $TAG points to $TAG_SHA, expected $GITHUB_SHA."
              exit 1
            fi
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists."
            exit 1
          fi

          {
            echo "release_version=$RELEASE_VERSION"
            echo "gradle_version=$GRADLE_VERSION"
            echo "tag=$TAG"
            echo "release_scope=$RELEASE_SCOPE"
            echo "source_sha=$GITHUB_SHA"
            echo "artifact_name=$ARTIFACT_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify and build release artifacts
        env:
          VERSION: ${{ steps.metadata.outputs.gradle_version }}
        run: |
          ./gradlew --no-daemon clean check assemble \
            -PwayfarerVersion="$VERSION"

      - name: Collect release assets
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.release_version }}
          TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_SCOPE: ${{ steps.metadata.outputs.release_scope }}
          SOURCE_SHA: ${{ steps.metadata.outputs.source_sha }}
          TEST_INSTRUCTIONS: ${{ inputs.test_instructions }}
        run: |
          set -euo pipefail
          mkdir -p release

          copy_plugin_jar() {
            local module_path="$1"
            local artifact_name="$2"

            mapfile -t jars < <(
              find "$module_path/build/libs" -maxdepth 1 -type f \
                -name "*.jar" \
                ! -name "*-sources.jar" \
                ! -name "*-javadoc.jar" \
                | sort
            )

            if [[ "${#jars[@]}" -ne 1 ]]; then
              echo "::error::Expected exactly one runtime JAR in $module_path/build/libs, found ${#jars[@]}."
              printf '%s\n' "${jars[@]}"
              exit 1
            fi

            cp "${jars[0]}" "release/${artifact_name}-${RELEASE_VERSION}.jar"
          }

          copy_plugin_jar "plugins/wayfarer-core" "Wayfarer_Core"

          CONFIG_VERSION="$(
            awk '$1 == "config-version:" { print $2; exit }' \
              plugins/wayfarer-core/src/main/resources/config.yml
          )"
          if [[ -z "$CONFIG_VERSION" ]]; then
            echo "::error::Core config.yml must declare config-version before release."
            exit 1
          fi

          MIGRATION_VERSION="$(
            find plugins/wayfarer-core/src/main/resources/db/migration/core \
              -maxdepth 1 -type f -name 'V*__*.sql' -printf '%f\n' \
              | sed 's/__.*//' | sort -V | tail -n 1
          )"
          if [[ -z "$MIGRATION_VERSION" ]]; then
            echo "::error::No Core Flyway migration version was found."
            exit 1
          fi

          cp gradle/libs.versions.toml release/DEPENDENCY_VERSIONS.toml

          (
            cd release
            sha256sum \
              "Wayfarer_Core-${RELEASE_VERSION}.jar" \
              DEPENDENCY_VERSIONS.toml \
              > SHA256SUMS.txt
          )

          cat > release/RELEASE_MANIFEST.md <<EOF
          # Project Wayfarer Plugins Release Manifest

          - Release type: Pre-release / test-server candidate
          - Version: ${RELEASE_VERSION}
          - Tag: ${TAG}
          - Release scope: ${RELEASE_SCOPE}
          - Source commit: ${SOURCE_SHA}
          - Config version: ${CONFIG_VERSION}
          - Migration version: ${MIGRATION_VERSION}
          - Source branch: main
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Test instructions: ${TEST_INSTRUCTIONS:-Not specified}
          - Runtime status: Not approved for the main server

          This release is intended only for step-by-step verification on the test server.
          Publishing this release does not install plugins, run migrations, change runtime
          configuration, restart a server, or approve handoff to the main server.

          ## Asset SHA-256

          EOF

          while read -r hash file; do
            printf -- '- `%s`: `%s`\n' "$file" "$hash" >> release/RELEASE_MANIFEST.md
          done < release/SHA256SUMS.txt

          cat >> release/RELEASE_MANIFEST.md <<EOF

          The manifest scope is authoritative for stable-release scope matching.
          EOF

          cat > release/RELEASE_NOTES.md <<EOF
          ## Status

          This is a **test-server candidate**. It is not approved for the main server.

          Perform test-server verification step by step. Runtime installation, migrations,
          configuration changes, restart operations, acceptance decisions, and rollback
          decisions remain outside this workflow.

          - Source commit: \`${SOURCE_SHA}\`
          - Release scope: \`${RELEASE_SCOPE}\`
          - Test instructions: ${TEST_INSTRUCTIONS:-Not specified}
          EOF

      - name: Generate build provenance
        uses: actions/attest@v4
        with:
          subject-path: "release/Wayfarer_Core-${{ steps.metadata.outputs.release_version }}.jar"

      - name: Store release package for approval
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish test-server candidate
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: test-server-release

    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out approved source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          fetch-depth: 0

      - name: Download approved release package
        uses: actions/download-artifact@v5
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release/

      - name: Verify release package
        run: |
          set -euo pipefail
          (
            cd release
            sha256sum --check SHA256SUMS.txt
          )

      - name: Create annotated pre-release tag
        env:
          TAG: ${{ needs.build.outputs.tag }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_SHA="$(git rev-list -n 1 "$TAG")"
            if [[ "$TAG_SHA" != "$SOURCE_SHA" ]]; then
              echo "::error::Existing tag $TAG points to $TAG_SHA, expected $SOURCE_SHA."
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$SOURCE_SHA" -m "Project Wayfarer Plugins $TAG test-server candidate"
            git push origin "$TAG"
          fi

      - name: Publish GitHub pre-release
        env:
          TAG: ${{ needs.build.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists."
            exit 1
          fi

          gh release create "$TAG" \
            "release/Wayfarer_Core-${TAG}.jar" \
            release/SHA256SUMS.txt \
            release/RELEASE_MANIFEST.md \
            release/DEPENDENCY_VERSIONS.toml \
            --verify-tag \
            --prerelease \
            --latest=false \
            --title "Project Wayfarer Plugins $TAG (Test-Server Candidate)" \
            --notes-file release/RELEASE_NOTES.md

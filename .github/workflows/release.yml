name: Create Main-Server Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable release version with uppercase V (example: V0.0.1)"
        required: true
        type: string
      release_scope:
        description: "Artifact set included in this release"
        required: true
        type: choice
        options:
          - core
          - main-frontier
          - all
        default: main-frontier
      stable_source_commit:
        description: "Exact 40-character commit SHA containing the reviewed stable product source"
        required: true
        type: string
      test_evidence:
        description: "Committed Markdown path under docs/testing/results/"
        required: true
        type: string
      main_server_instruction:
        description: "Committed Markdown path under docs/requirements/main-server/"
        required: true
        type: string
      requirement_traceability:
        description: "Committed requirement traceability Markdown path"
        required: true
        type: string
      release_readiness:
        description: "Committed release-readiness Markdown path"
        required: true
        type: string
      requirements_cleared:
        description: "Authorize stable source-side publication after confirming Plugin-side publication prerequisites are cleared; Project Runtime acceptance remains pending"
        required: true
        type: boolean

permissions: {}

concurrency:
  group: release-${{ inputs.version }}-${{ inputs.release_scope }}
  cancel-in-progress: false

jobs:
  build:
    name: Build main-server handoff package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    outputs:
      release_version: ${{ steps.metadata.outputs.release_version }}
      gradle_version: ${{ steps.metadata.outputs.gradle_version }}
      tag: ${{ steps.metadata.outputs.tag }}
      release_scope: ${{ steps.metadata.outputs.release_scope }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      handoff_source_commit: ${{ steps.metadata.outputs.handoff_source_commit }}
      publication_mode: ${{ steps.metadata.outputs.publication_mode }}
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      expected_stable_sha256: ${{ steps.metadata.outputs.expected_stable_sha256 }}
      evidence_commit: ${{ steps.metadata.outputs.evidence_commit }}
      evidence_sha256: ${{ steps.metadata.outputs.evidence_sha256 }}
      instruction_commit: ${{ steps.metadata.outputs.instruction_commit }}
      instruction_sha256: ${{ steps.metadata.outputs.instruction_sha256 }}
      traceability_commit: ${{ steps.metadata.outputs.traceability_commit }}
      traceability_sha256: ${{ steps.metadata.outputs.traceability_sha256 }}
      traceability_gate: ${{ steps.metadata.outputs.traceability_gate }}
      readiness_commit: ${{ steps.metadata.outputs.readiness_commit }}
      readiness_sha256: ${{ steps.metadata.outputs.readiness_sha256 }}
      readiness_gate: ${{ steps.metadata.outputs.readiness_gate }}

    steps:
      - name: Check out release automation and evidence
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release request and capture evidence
        id: metadata
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_SCOPE: ${{ inputs.release_scope }}
          STABLE_SOURCE_COMMIT: ${{ inputs.stable_source_commit }}
          TEST_EVIDENCE: ${{ inputs.test_evidence }}
          MAIN_SERVER_INSTRUCTION: ${{ inputs.main_server_instruction }}
          REQUIREMENT_TRACEABILITY: ${{ inputs.requirement_traceability }}
          RELEASE_READINESS: ${{ inputs.release_readiness }}
          REQUIREMENTS_CLEARED: ${{ inputs.requirements_cleared }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run this workflow from the main branch."
            exit 1
          fi

          RELEASE_VERSION="$INPUT_VERSION"
          GRADLE_VERSION="${INPUT_VERSION#V}"
          TAG="$INPUT_VERSION"
          ARTIFACT_NAME="release-$RELEASE_VERSION-$RELEASE_SCOPE"

          git fetch origin main:refs/remotes/origin/main --tags --force

          if [[ "$RELEASE_SCOPE" == "core" ]]; then
            EXPECTED_STABLE_SHA256="$(
              bash scripts/release/validate-stable-release-inputs.sh
            )"
          else
            bash scripts/release/validate-stable-release-inputs.sh >/dev/null
            EXPECTED_STABLE_SHA256=""
          fi

          HANDOFF_SOURCE_COMMIT="$(git rev-parse HEAD)"
          SNAPSHOT_DIR="$RUNNER_TEMP/stable-release-handoff-snapshot"
          cp \
            scripts/release/assemble-stable-release-package.sh \
            "$RUNNER_TEMP/assemble-stable-release-package.sh"
          cp \
            scripts/release/validate-stable-publication-state.sh \
            "$RUNNER_TEMP/validate-stable-publication-state.sh"
          cp \
            scripts/release/release-policy.sh \
            "$RUNNER_TEMP/release-policy.sh"
          cp \
            scripts/release/assemble-scoped-stable-package.sh \
            "$RUNNER_TEMP/assemble-scoped-stable-package.sh"
          cp \
            scripts/release/create-runtime-jar-manifest.sh \
            "$RUNNER_TEMP/create-runtime-jar-manifest.sh"

          PUBLICATION_MODE="$(
            TAG="$TAG" \
              STABLE_SOURCE_COMMIT="$STABLE_SOURCE_COMMIT" \
              bash "$RUNNER_TEMP/validate-stable-publication-state.sh"
          )"

          SNAPSHOT_DIR="$SNAPSHOT_DIR" \
            HANDOFF_SOURCE_COMMIT="$HANDOFF_SOURCE_COMMIT" \
            RELEASE_SCOPE="$RELEASE_SCOPE" \
            PLUGIN_TEST_REPORT="docs/reports/Project_Wayfarer_Plugin_Release_Test_Report_V0.0.2_2026-07-30.md" \
            bash "$RUNNER_TEMP/assemble-stable-release-package.sh" snapshot

          EVIDENCE_COMMIT="$HANDOFF_SOURCE_COMMIT"
          EVIDENCE_SHA256="$(sha256sum "$SNAPSHOT_DIR/assets/TEST_SERVER_EVIDENCE.md" | cut -d ' ' -f 1)"
          INSTRUCTION_COMMIT="$HANDOFF_SOURCE_COMMIT"
          INSTRUCTION_SHA256="$(sha256sum "$SNAPSHOT_DIR/assets/MAIN_SERVER_INSTRUCTION.md" | cut -d ' ' -f 1)"
          TRACEABILITY_COMMIT="$HANDOFF_SOURCE_COMMIT"
          TRACEABILITY_SHA256="$(sha256sum "$SNAPSHOT_DIR/assets/REQUIREMENT_TRACEABILITY.md" | cut -d ' ' -f 1)"
          TRACEABILITY_GATE="CLEARED"
          READINESS_COMMIT="$HANDOFF_SOURCE_COMMIT"
          READINESS_SHA256="$(sha256sum "$SNAPSHOT_DIR/assets/RELEASE_READINESS.md" | cut -d ' ' -f 1)"
          READINESS_GATE="READY"

          {
            echo "release_version=$RELEASE_VERSION"
            echo "gradle_version=$GRADLE_VERSION"
            echo "tag=$TAG"
            echo "release_scope=$RELEASE_SCOPE"
            echo "source_sha=$STABLE_SOURCE_COMMIT"
            echo "handoff_source_commit=$HANDOFF_SOURCE_COMMIT"
            echo "publication_mode=$PUBLICATION_MODE"
            echo "artifact_name=$ARTIFACT_NAME"
            echo "expected_stable_sha256=$EXPECTED_STABLE_SHA256"
            echo "evidence_commit=$EVIDENCE_COMMIT"
            echo "evidence_sha256=$EVIDENCE_SHA256"
            echo "instruction_commit=$INSTRUCTION_COMMIT"
            echo "instruction_sha256=$INSTRUCTION_SHA256"
            echo "traceability_commit=$TRACEABILITY_COMMIT"
            echo "traceability_sha256=$TRACEABILITY_SHA256"
            echo "traceability_gate=$TRACEABILITY_GATE"
            echo "readiness_commit=$READINESS_COMMIT"
            echo "readiness_sha256=$READINESS_SHA256"
            echo "readiness_gate=$READINESS_GATE"
          } >> "$GITHUB_OUTPUT"

      - name: Check out reviewed stable product source
        env:
          SOURCE_SHA: ${{ steps.metadata.outputs.source_sha }}
        run: |
          set -euo pipefail
          git checkout --detach "$SOURCE_SHA"

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify and build release artifacts
        env:
          VERSION: ${{ steps.metadata.outputs.gradle_version }}
        run: |
          ./gradlew --no-daemon clean check assemble \
            -PwayfarerVersion="$VERSION"

      - name: Verify stable candidate SHA-256
        if: steps.metadata.outputs.release_scope == 'core'
        env:
          EXPECTED_STABLE_SHA256: ${{ steps.metadata.outputs.expected_stable_sha256 }}
        run: |
          set -euo pipefail
          mapfile -t jars < <(
            find plugins/wayfarer-core/build/libs -maxdepth 1 -type f \
              -name "*.jar" \
              ! -name "*-sources.jar" \
              ! -name "*-javadoc.jar" \
              | sort
          )
          if [[ "${#jars[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one Core runtime JAR, found ${#jars[@]}."
            exit 1
          fi
          actual_sha256="$(sha256sum "${jars[0]}" | awk '{ print toupper($1) }')"
          if [[ "$actual_sha256" != "$EXPECTED_STABLE_SHA256" ]]; then
            echo "::error::Stable candidate SHA-256 mismatch."
            exit 1
          fi

      - name: Bind scoped runtime JARs to accepted evidence
        if: steps.metadata.outputs.release_scope != 'core'
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.release_version }}
          RELEASE_SCOPE: ${{ steps.metadata.outputs.release_scope }}
          TEST_EVIDENCE: ${{ runner.temp }}/stable-release-handoff-snapshot/assets/TEST_SERVER_EVIDENCE.md
          OUTPUT_MANIFEST: ${{ runner.temp }}/runtime-jars.tsv
        run: bash "$RUNNER_TEMP/create-runtime-jar-manifest.sh"

      - name: Collect release assets
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.release_version }}
          TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_SCOPE: ${{ steps.metadata.outputs.release_scope }}
          PRODUCT_SOURCE_COMMIT: ${{ steps.metadata.outputs.source_sha }}
          HANDOFF_SOURCE_COMMIT: ${{ steps.metadata.outputs.handoff_source_commit }}
          EXPECTED_STABLE_SHA256: ${{ steps.metadata.outputs.expected_stable_sha256 }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_SCOPE" != "core" ]]; then
            SNAPSHOT_DIR="$RUNNER_TEMP/stable-release-handoff-snapshot" \
              PACKAGE_ROOT="$GITHUB_WORKSPACE/release" \
              RUNTIME_JAR_MANIFEST="$RUNNER_TEMP/runtime-jars.tsv" \
              DEPENDENCY_VERSIONS_SOURCE="gradle/libs.versions.toml" \
              bash "$RUNNER_TEMP/assemble-scoped-stable-package.sh" assemble
            PACKAGE_ROOT="$GITHUB_WORKSPACE/release" \
              SNAPSHOT_DIR="$RUNNER_TEMP/stable-release-handoff-snapshot" \
              RUNTIME_JAR_MANIFEST="$RUNNER_TEMP/runtime-jars.tsv" \
              DEPENDENCY_VERSIONS_SOURCE="gradle/libs.versions.toml" \
              bash "$RUNNER_TEMP/assemble-scoped-stable-package.sh" verify
            mkdir -p "$GITHUB_WORKSPACE/release/helpers"
            cp "$RUNNER_TEMP/assemble-scoped-stable-package.sh" \
              "$GITHUB_WORKSPACE/release/helpers/assemble-scoped-stable-package.sh"
            cp "$RUNNER_TEMP/release-policy.sh" \
              "$GITHUB_WORKSPACE/release/helpers/release-policy.sh"
            cp "$RUNNER_TEMP/validate-stable-publication-state.sh" \
              "$GITHUB_WORKSPACE/release/helpers/validate-stable-publication-state.sh"
            cp "$RUNNER_TEMP/runtime-jars.tsv" \
              "$GITHUB_WORKSPACE/release/RUNTIME_JAR_MANIFEST.tsv"
            exit 0
          fi

          mapfile -t jars < <(
            find plugins/wayfarer-core/build/libs -maxdepth 1 -type f \
              -name "*.jar" \
              ! -name "*-sources.jar" \
              ! -name "*-javadoc.jar" \
              | sort
          )
          if [[ "${#jars[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one Core runtime JAR, found ${#jars[@]}."
            exit 1
          fi

          CONFIG_VERSION="$(
            awk '$1 == "config-version:" { print $2; exit }' \
              plugins/wayfarer-core/src/main/resources/config.yml
          )"
          if [[ -z "$CONFIG_VERSION" ]]; then
            echo "::error::Core config.yml must declare config-version before release."
            exit 1
          fi

          MIGRATION_VERSION="$(
            find plugins/wayfarer-core/src/main/resources/db/migration/core \
              -maxdepth 1 -type f -name 'V*__*.sql' -printf '%f\n' \
              | sed 's/__.*//' | sort -V | tail -n 1
          )"
          if [[ -z "$MIGRATION_VERSION" ]]; then
            echo "::error::No Core Flyway migration version was found."
            exit 1
          fi

          SNAPSHOT_DIR="$RUNNER_TEMP/stable-release-handoff-snapshot" \
            PACKAGE_ROOT="$GITHUB_WORKSPACE/release" \
            PRODUCT_JAR="${jars[0]}" \
            DEPENDENCY_VERSIONS_SOURCE="gradle/libs.versions.toml" \
            CONFIG_VERSION="$CONFIG_VERSION" \
            MIGRATION_VERSION="$MIGRATION_VERSION" \
            bash "$RUNNER_TEMP/assemble-stable-release-package.sh" assemble

          PACKAGE_ROOT="$GITHUB_WORKSPACE/release" \
            bash "$RUNNER_TEMP/assemble-stable-release-package.sh" verify

          mkdir -p "$GITHUB_WORKSPACE/release/helpers"
          cp \
            "$RUNNER_TEMP/assemble-stable-release-package.sh" \
            "$GITHUB_WORKSPACE/release/helpers/assemble-stable-release-package.sh"
          cp \
            "$RUNNER_TEMP/validate-stable-publication-state.sh" \
            "$GITHUB_WORKSPACE/release/helpers/validate-stable-publication-state.sh"
          cp \
            "$RUNNER_TEMP/release-policy.sh" \
            "$GITHUB_WORKSPACE/release/helpers/release-policy.sh"

      - name: Generate build provenance
        uses: actions/attest@v4
        with:
          subject-path: "release/assets/Wayfarer_*.jar"

      - name: Store release package for approval
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish main-server handoff release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: main-server-release

    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out reviewed stable source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          fetch-depth: 0

      - name: Download approved release package
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release/

      - name: Verify release package
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
          TAG: ${{ needs.build.outputs.tag }}
          PRODUCT_SOURCE_COMMIT: ${{ needs.build.outputs.source_sha }}
          HANDOFF_SOURCE_COMMIT: ${{ needs.build.outputs.handoff_source_commit }}
          EXPECTED_STABLE_SHA256: ${{ needs.build.outputs.expected_stable_sha256 }}
        run: |
          set -euo pipefail
          if [[ "${{ needs.build.outputs.release_scope }}" == "core" ]]; then
            PACKAGE_ROOT="$GITHUB_WORKSPACE/release" \
              bash release/helpers/assemble-stable-release-package.sh verify
          else
            PACKAGE_ROOT="$GITHUB_WORKSPACE/release" \
              SNAPSHOT_DIR="$GITHUB_WORKSPACE/release" \
              RUNTIME_JAR_MANIFEST="$GITHUB_WORKSPACE/release/RUNTIME_JAR_MANIFEST.tsv" \
              DEPENDENCY_VERSIONS_SOURCE="$GITHUB_WORKSPACE/release/assets/DEPENDENCY_VERSIONS.toml" \
              bash release/helpers/assemble-scoped-stable-package.sh verify
          fi

      - name: Create annotated stable tag
        env:
          TAG: ${{ needs.build.outputs.tag }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          STABLE_SOURCE_COMMIT: ${{ needs.build.outputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main --tags --force

          PUBLICATION_MODE="$(
            bash release/helpers/validate-stable-publication-state.sh
          )"
          case "$PUBLICATION_MODE" in
            new)
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "$TAG" "$SOURCE_SHA" -m "Project Wayfarer Plugins $TAG main-server handoff"
              git push origin "$TAG"
              ;;
            recover-existing-tag)
              echo "Reusing existing annotated $TAG at exact stable source $SOURCE_SHA."
              ;;
            *)
              echo "::error::Unexpected publication mode: $PUBLICATION_MODE"
              exit 1
              ;;
          esac

      - name: Publish GitHub release
        env:
          TAG: ${{ needs.build.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists."
            exit 1
          fi

          mapfile -t release_asset_names < release/RELEASE_ASSET_FILENAMES.txt
          release_assets=()
          for filename in "${release_asset_names[@]}"; do
            [[ "$filename" =~ ^[-A-Za-z0-9_.]+$ ]] || {
              echo "::error::Unsafe release asset filename: $filename"
              exit 1
            }
            [[ -f "release/assets/$filename" && ! -L "release/assets/$filename" ]] || {
              echo "::error::Release asset is missing or not regular: $filename"
              exit 1
            }
            release_assets+=("release/assets/$filename")
          done

          gh release create "$TAG" \
            "${release_assets[@]}" \
            --verify-tag \
            --latest \
            --title "Project Wayfarer Plugins $TAG" \
            --notes-file release/RELEASE_NOTES.md

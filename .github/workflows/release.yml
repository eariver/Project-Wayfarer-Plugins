name: Create Main-Server Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable release version with uppercase V (example: V0.0.1)"
        required: true
        type: string
      release_scope:
        description: "Artifact set included in this release"
        required: true
        type: choice
        options:
          - core
          - core-main
          - core-frontier
          - all
        default: core
      approved_prerelease_tag:
        description: "Approved test-server pre-release tag (example: V0.0.1-alpha.4)"
        required: true
        type: string
      test_evidence:
        description: "Committed Markdown path under docs/testing/results/"
        required: true
        type: string
      main_server_instruction:
        description: "Committed Markdown path under docs/requirements/main-server/"
        required: true
        type: string
      requirement_traceability:
        description: "Committed requirement traceability Markdown path"
        required: true
        type: string
      release_readiness:
        description: "Committed release-readiness Markdown path"
        required: true
        type: string
      requirements_cleared:
        description: "Confirm test completion and clearance of all main-server requirements"
        required: true
        type: boolean

permissions: {}

concurrency:
  group: release-${{ inputs.version }}-${{ inputs.release_scope }}
  cancel-in-progress: false

jobs:
  build:
    name: Build main-server handoff package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    outputs:
      release_version: ${{ steps.metadata.outputs.release_version }}
      gradle_version: ${{ steps.metadata.outputs.gradle_version }}
      tag: ${{ steps.metadata.outputs.tag }}
      release_scope: ${{ steps.metadata.outputs.release_scope }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      approved_prerelease_tag: ${{ steps.metadata.outputs.approved_prerelease_tag }}
      evidence_commit: ${{ steps.metadata.outputs.evidence_commit }}
      evidence_sha256: ${{ steps.metadata.outputs.evidence_sha256 }}
      instruction_commit: ${{ steps.metadata.outputs.instruction_commit }}
      instruction_sha256: ${{ steps.metadata.outputs.instruction_sha256 }}
      traceability_commit: ${{ steps.metadata.outputs.traceability_commit }}
      traceability_sha256: ${{ steps.metadata.outputs.traceability_sha256 }}
      traceability_gate: ${{ steps.metadata.outputs.traceability_gate }}
      readiness_commit: ${{ steps.metadata.outputs.readiness_commit }}
      readiness_sha256: ${{ steps.metadata.outputs.readiness_sha256 }}
      readiness_gate: ${{ steps.metadata.outputs.readiness_gate }}

    steps:
      - name: Check out release automation and evidence
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release request and capture evidence
        id: metadata
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_SCOPE: ${{ inputs.release_scope }}
          APPROVED_PRERELEASE_TAG: ${{ inputs.approved_prerelease_tag }}
          TEST_EVIDENCE: ${{ inputs.test_evidence }}
          MAIN_SERVER_INSTRUCTION: ${{ inputs.main_server_instruction }}
          REQUIREMENT_TRACEABILITY: ${{ inputs.requirement_traceability }}
          RELEASE_READINESS: ${{ inputs.release_readiness }}
          REQUIREMENTS_CLEARED: ${{ inputs.requirements_cleared }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run this workflow from the main branch."
            exit 1
          fi

          if [[ "$REQUIREMENTS_CLEARED" != "true" ]]; then
            echo "::error::Main-server requirements must be explicitly confirmed as cleared."
            exit 1
          fi

          if [[ ! "$INPUT_VERSION" =~ ^V0\.0\.[1-9][0-9]*$ ]]; then
            echo "::error::Stable release version must resemble V0.0.1."
            exit 1
          fi

          if [[ "$RELEASE_SCOPE" != "core" ]]; then
            echo "::error::The current V0.0.x release policy permits only release_scope=core."
            exit 1
          fi

          if [[ ! "$APPROVED_PRERELEASE_TAG" =~ ^V0\.0\.[1-9][0-9]*-[0-9A-Za-z][0-9A-Za-z.-]*$ ]]; then
            echo "::error::Approved pre-release tag must resemble V0.0.1-alpha.1."
            exit 1
          fi

          RELEASE_VERSION="$INPUT_VERSION"
          GRADLE_VERSION="${INPUT_VERSION#V}"
          TAG="$INPUT_VERSION"
          ARTIFACT_NAME="release-$RELEASE_VERSION-$RELEASE_SCOPE"

          if [[ "$APPROVED_PRERELEASE_TAG" != "${TAG}-"* ]]; then
            echo "::error::Approved pre-release $APPROVED_PRERELEASE_TAG does not belong to stable version $TAG."
            exit 1
          fi

          if [[ "$TEST_EVIDENCE" == *".."* || ! "$TEST_EVIDENCE" =~ ^docs/testing/results/[A-Za-z0-9._/-]+\.md$ ]]; then
            echo "::error::Test evidence must be a committed Markdown file under docs/testing/results/."
            exit 1
          fi

          if [[ "$MAIN_SERVER_INSTRUCTION" == *".."* || ! "$MAIN_SERVER_INSTRUCTION" =~ ^docs/requirements/main-server/[A-Za-z0-9._/-]+\.md$ ]]; then
            echo "::error::Main-server instruction must be a committed Markdown file under docs/requirements/main-server/."
            exit 1
          fi

          if [[ "$REQUIREMENT_TRACEABILITY" == *".."* || ! "$REQUIREMENT_TRACEABILITY" =~ ^docs/requirements/main-server/[A-Za-z0-9._/-]+\.md$ ]]; then
            echo "::error::Requirement traceability must be a committed Markdown file under docs/requirements/main-server/."
            exit 1
          fi

          if [[ "$RELEASE_READINESS" == *".."* || ! "$RELEASE_READINESS" =~ ^docs/handoff/[A-Za-z0-9._/-]+\.md$ ]]; then
            echo "::error::Release readiness must be a committed Markdown file under docs/handoff/."
            exit 1
          fi

          git fetch origin main --tags --force

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Stable release $TAG already exists."
            exit 1
          fi

          mapfile -t RELEASE_DATA < <(
            gh release view "$APPROVED_PRERELEASE_TAG" \
              --json tagName,isPrerelease \
              --jq '[.tagName, (.isPrerelease | tostring)] | .[]'
          )

          if [[ "${RELEASE_DATA[0]:-}" != "$APPROVED_PRERELEASE_TAG" || "${RELEASE_DATA[1]:-}" != "true" ]]; then
            echo "::error::$APPROVED_PRERELEASE_TAG is not an existing GitHub pre-release."
            exit 1
          fi

          PRERELEASE_MANIFEST_DIR="$RUNNER_TEMP/approved-prerelease"
          mkdir -p "$PRERELEASE_MANIFEST_DIR"
          gh release download "$APPROVED_PRERELEASE_TAG" \
            --pattern RELEASE_MANIFEST.md \
            --dir "$PRERELEASE_MANIFEST_DIR"
          if ! grep -Fq -- "- Release scope: ${RELEASE_SCOPE}" \
            "$PRERELEASE_MANIFEST_DIR/RELEASE_MANIFEST.md"; then
            echo "::error::Approved pre-release manifest scope does not match ${RELEASE_SCOPE}."
            exit 1
          fi

          PRERELEASE_SHA="$(git rev-list -n 1 "$APPROVED_PRERELEASE_TAG")"

          if ! git merge-base --is-ancestor "$PRERELEASE_SHA" origin/main; then
            echo "::error::Approved pre-release source $PRERELEASE_SHA is not contained in the current main history."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_SHA="$(git rev-list -n 1 "$TAG")"
            if [[ "$TAG_SHA" != "$PRERELEASE_SHA" ]]; then
              echo "::error::Existing stable tag $TAG points to $TAG_SHA, expected $PRERELEASE_SHA."
              exit 1
            fi
          fi

          if ! git ls-files --error-unmatch "$TEST_EVIDENCE" >/dev/null 2>&1; then
            echo "::error::Test evidence $TEST_EVIDENCE is not committed on the selected main revision."
            exit 1
          fi

          if ! git ls-files --error-unmatch "$MAIN_SERVER_INSTRUCTION" >/dev/null 2>&1; then
            echo "::error::Main-server instruction $MAIN_SERVER_INSTRUCTION is not committed on the selected main revision."
            exit 1
          fi

          if ! git ls-files --error-unmatch "$REQUIREMENT_TRACEABILITY" >/dev/null 2>&1; then
            echo "::error::Requirement traceability $REQUIREMENT_TRACEABILITY is not committed on the selected main revision."
            exit 1
          fi

          if ! git ls-files --error-unmatch "$RELEASE_READINESS" >/dev/null 2>&1; then
            echo "::error::Release readiness $RELEASE_READINESS is not committed on the selected main revision."
            exit 1
          fi

          if ! grep -Fxq -- "- Release gate: CLEARED" "$REQUIREMENT_TRACEABILITY"; then
            echo "::error::Requirement traceability release gate is not CLEARED."
            exit 1
          fi

          if ! grep -Fxq -- "- Release readiness: READY" "$RELEASE_READINESS"; then
            echo "::error::Release readiness is not READY."
            exit 1
          fi

          if awk -F'|' '
            BEGIN { incomplete = 0 }
            /^\|/ {
              status = $9
              gsub(/^[ \t]+|[ \t]+$/, "", status)
              if (status == "Not started" || status == "In progress" ||
                  status == "Failed" || status == "Blocked") {
                incomplete = 1
              }
            }
            END { exit incomplete ? 0 : 1 }
          ' "$REQUIREMENT_TRACEABILITY"; then
            echo "::error::Requirement traceability contains an incomplete or failed status."
            exit 1
          fi

          if awk -F'|' '
            BEGIN { missing_reason = 0 }
            /^\|/ {
              status = $9
              notes = $10
              gsub(/^[ \t]+|[ \t]+$/, "", status)
              gsub(/^[ \t]+|[ \t]+$/, "", notes)
              if (status == "Not applicable" && notes == "") {
                missing_reason = 1
              }
            }
            END { exit missing_reason ? 0 : 1 }
          ' "$REQUIREMENT_TRACEABILITY"; then
            echo "::error::Every Not applicable traceability row must include a reason in Notes."
            exit 1
          fi

          if ! grep -Fq -- "$APPROVED_PRERELEASE_TAG" "$TEST_EVIDENCE"; then
            echo "::error::Test evidence does not identify approved pre-release $APPROVED_PRERELEASE_TAG."
            exit 1
          fi

          if ! grep -Fq -- "$PRERELEASE_SHA" "$TEST_EVIDENCE"; then
            echo "::error::Test evidence does not identify approved source commit $PRERELEASE_SHA."
            exit 1
          fi

          cp "$TEST_EVIDENCE" "$RUNNER_TEMP/TEST_SERVER_EVIDENCE.md"
          cp "$MAIN_SERVER_INSTRUCTION" "$RUNNER_TEMP/MAIN_SERVER_INSTRUCTION.md"
          cp "$REQUIREMENT_TRACEABILITY" "$RUNNER_TEMP/REQUIREMENT_TRACEABILITY.md"
          cp "$RELEASE_READINESS" "$RUNNER_TEMP/RELEASE_READINESS.md"

          EVIDENCE_COMMIT="$(git rev-parse HEAD)"
          EVIDENCE_SHA256="$(sha256sum "$RUNNER_TEMP/TEST_SERVER_EVIDENCE.md" | cut -d ' ' -f 1)"
          INSTRUCTION_COMMIT="$EVIDENCE_COMMIT"
          INSTRUCTION_SHA256="$(sha256sum "$RUNNER_TEMP/MAIN_SERVER_INSTRUCTION.md" | cut -d ' ' -f 1)"
          TRACEABILITY_COMMIT="$EVIDENCE_COMMIT"
          TRACEABILITY_SHA256="$(sha256sum "$RUNNER_TEMP/REQUIREMENT_TRACEABILITY.md" | cut -d ' ' -f 1)"
          TRACEABILITY_GATE="CLEARED"
          READINESS_COMMIT="$EVIDENCE_COMMIT"
          READINESS_SHA256="$(sha256sum "$RUNNER_TEMP/RELEASE_READINESS.md" | cut -d ' ' -f 1)"
          READINESS_GATE="READY"

          {
            echo "release_version=$RELEASE_VERSION"
            echo "gradle_version=$GRADLE_VERSION"
            echo "tag=$TAG"
            echo "release_scope=$RELEASE_SCOPE"
            echo "source_sha=$PRERELEASE_SHA"
            echo "artifact_name=$ARTIFACT_NAME"
            echo "approved_prerelease_tag=$APPROVED_PRERELEASE_TAG"
            echo "evidence_commit=$EVIDENCE_COMMIT"
            echo "evidence_sha256=$EVIDENCE_SHA256"
            echo "instruction_commit=$INSTRUCTION_COMMIT"
            echo "instruction_sha256=$INSTRUCTION_SHA256"
            echo "traceability_commit=$TRACEABILITY_COMMIT"
            echo "traceability_sha256=$TRACEABILITY_SHA256"
            echo "traceability_gate=$TRACEABILITY_GATE"
            echo "readiness_commit=$READINESS_COMMIT"
            echo "readiness_sha256=$READINESS_SHA256"
            echo "readiness_gate=$READINESS_GATE"
          } >> "$GITHUB_OUTPUT"

      - name: Check out approved pre-release source
        env:
          SOURCE_SHA: ${{ steps.metadata.outputs.source_sha }}
        run: |
          set -euo pipefail
          git checkout --detach "$SOURCE_SHA"

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify and build release artifacts
        env:
          VERSION: ${{ steps.metadata.outputs.gradle_version }}
        run: |
          ./gradlew --no-daemon clean check assemble \
            -PwayfarerVersion="$VERSION"

      - name: Collect release assets
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.release_version }}
          TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_SCOPE: ${{ steps.metadata.outputs.release_scope }}
          SOURCE_SHA: ${{ steps.metadata.outputs.source_sha }}
          APPROVED_PRERELEASE_TAG: ${{ steps.metadata.outputs.approved_prerelease_tag }}
          EVIDENCE_COMMIT: ${{ steps.metadata.outputs.evidence_commit }}
          EVIDENCE_SHA256: ${{ steps.metadata.outputs.evidence_sha256 }}
          INSTRUCTION_COMMIT: ${{ steps.metadata.outputs.instruction_commit }}
          INSTRUCTION_SHA256: ${{ steps.metadata.outputs.instruction_sha256 }}
          TRACEABILITY_COMMIT: ${{ steps.metadata.outputs.traceability_commit }}
          TRACEABILITY_SHA256: ${{ steps.metadata.outputs.traceability_sha256 }}
          TRACEABILITY_GATE: ${{ steps.metadata.outputs.traceability_gate }}
          READINESS_COMMIT: ${{ steps.metadata.outputs.readiness_commit }}
          READINESS_SHA256: ${{ steps.metadata.outputs.readiness_sha256 }}
          READINESS_GATE: ${{ steps.metadata.outputs.readiness_gate }}
          TEST_EVIDENCE: ${{ inputs.test_evidence }}
          MAIN_SERVER_INSTRUCTION: ${{ inputs.main_server_instruction }}
          REQUIREMENT_TRACEABILITY: ${{ inputs.requirement_traceability }}
          RELEASE_READINESS: ${{ inputs.release_readiness }}
        run: |
          set -euo pipefail
          mkdir -p release

          copy_plugin_jar() {
            local module_path="$1"
            local artifact_name="$2"

            mapfile -t jars < <(
              find "$module_path/build/libs" -maxdepth 1 -type f \
                -name "*.jar" \
                ! -name "*-sources.jar" \
                ! -name "*-javadoc.jar" \
                | sort
            )

            if [[ "${#jars[@]}" -ne 1 ]]; then
              echo "::error::Expected exactly one runtime JAR in $module_path/build/libs, found ${#jars[@]}."
              printf '%s\n' "${jars[@]}"
              exit 1
            fi

            cp "${jars[0]}" "release/${artifact_name}-${RELEASE_VERSION}.jar"
          }

          copy_plugin_jar "plugins/wayfarer-core" "Wayfarer_Core"

          CONFIG_VERSION="$(
            awk '$1 == "config-version:" { print $2; exit }' \
              plugins/wayfarer-core/src/main/resources/config.yml
          )"
          if [[ -z "$CONFIG_VERSION" ]]; then
            echo "::error::Core config.yml must declare config-version before release."
            exit 1
          fi

          MIGRATION_VERSION="$(
            find plugins/wayfarer-core/src/main/resources/db/migration/core \
              -maxdepth 1 -type f -name 'V*__*.sql' -printf '%f\n' \
              | sed 's/__.*//' | sort -V | tail -n 1
          )"
          if [[ -z "$MIGRATION_VERSION" ]]; then
            echo "::error::No Core Flyway migration version was found."
            exit 1
          fi

          cp gradle/libs.versions.toml release/DEPENDENCY_VERSIONS.toml
          cp "$RUNNER_TEMP/TEST_SERVER_EVIDENCE.md" release/TEST_SERVER_EVIDENCE.md
          cp "$RUNNER_TEMP/MAIN_SERVER_INSTRUCTION.md" release/MAIN_SERVER_INSTRUCTION.md
          cp "$RUNNER_TEMP/REQUIREMENT_TRACEABILITY.md" release/REQUIREMENT_TRACEABILITY.md
          cp "$RUNNER_TEMP/RELEASE_READINESS.md" release/RELEASE_READINESS.md

          (
            cd release
            sha256sum \
              "Wayfarer_Core-${RELEASE_VERSION}.jar" \
              DEPENDENCY_VERSIONS.toml \
              TEST_SERVER_EVIDENCE.md \
              MAIN_SERVER_INSTRUCTION.md \
              REQUIREMENT_TRACEABILITY.md \
              RELEASE_READINESS.md \
              > SHA256SUMS.txt
          )

          cat > release/RELEASE_MANIFEST.md <<EOF
          # Project Wayfarer Plugins Release Manifest

          - Release type: Stable / main-server handoff candidate
          - Version: ${RELEASE_VERSION}
          - Tag: ${TAG}
          - Release scope: ${RELEASE_SCOPE}
          - Source commit: ${SOURCE_SHA}
          - Config version: ${CONFIG_VERSION}
          - Migration version: ${MIGRATION_VERSION}
          - Source lineage: contained in main
          - Approved pre-release: ${APPROVED_PRERELEASE_TAG}
          - Test evidence source path: ${TEST_EVIDENCE}
          - Test evidence source commit: ${EVIDENCE_COMMIT}
          - Test evidence SHA-256: ${EVIDENCE_SHA256}
          - Main-server instruction: ${MAIN_SERVER_INSTRUCTION}
          - Main-server instruction source commit: ${INSTRUCTION_COMMIT}
          - Main-server instruction SHA-256: ${INSTRUCTION_SHA256}
          - Requirement traceability path: ${REQUIREMENT_TRACEABILITY}
          - Requirement traceability source commit: ${TRACEABILITY_COMMIT}
          - Requirement traceability SHA-256: ${TRACEABILITY_SHA256}
          - Release gate: ${TRACEABILITY_GATE}
          - Release readiness path: ${RELEASE_READINESS}
          - Release readiness source commit: ${READINESS_COMMIT}
          - Release readiness SHA-256: ${READINESS_SHA256}
          - Release readiness: ${READINESS_GATE}
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Test-server verification: Confirmed complete by workflow operator
          - Main-server requirements: Confirmed cleared by workflow operator
          - Runtime status: Ready for handoff; not automatically installed

          This release is the source-side handoff package for Project Wayfarer main-server
          integration. Publishing it does not install plugins, run migrations, modify runtime
          configuration, restart servers, or constitute runtime acceptance.

          ## Asset SHA-256

          EOF

          while read -r hash file; do
            printf -- '- `%s`: `%s`\n' "$file" "$hash" >> release/RELEASE_MANIFEST.md
          done < release/SHA256SUMS.txt

          cat >> release/RELEASE_MANIFEST.md <<EOF

          This stable package matches the approved pre-release scope.
          EOF

          cat > release/RELEASE_NOTES.md <<EOF
          ## Status

          This release is ready for handoff to the Project Wayfarer main-server integration process.

          - Test-server verification: completed
          - Approved pre-release: \`${APPROVED_PRERELEASE_TAG}\`
          - Source commit: \`${SOURCE_SHA}\`
          - Release scope: \`${RELEASE_SCOPE}\`
          - Test evidence: \`${TEST_EVIDENCE}\` at \`${EVIDENCE_COMMIT}\`
          - Main-server instruction: ${MAIN_SERVER_INSTRUCTION}
          - Requirement traceability: \`${REQUIREMENT_TRACEABILITY}\` (${TRACEABILITY_GATE})
          - Release readiness: \`${RELEASE_READINESS}\` (${READINESS_GATE})

          Runtime deployment, migration execution, configuration application, backups,
          restart operations, acceptance evidence, and rollback decisions remain owned by
          the main-server integration process.
          EOF

      - name: Generate build provenance
        uses: actions/attest@v4
        with:
          subject-path: "release/Wayfarer_Core-${{ steps.metadata.outputs.release_version }}.jar"

      - name: Store release package for approval
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish main-server handoff release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: main-server-release

    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out approved source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          fetch-depth: 0

      - name: Download approved release package
        uses: actions/download-artifact@v5
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release/

      - name: Verify release package
        run: |
          set -euo pipefail
          (
            cd release
            sha256sum --check SHA256SUMS.txt
          )

      - name: Create annotated stable tag
        env:
          TAG: ${{ needs.build.outputs.tag }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_SHA="$(git rev-list -n 1 "$TAG")"
            if [[ "$TAG_SHA" != "$SOURCE_SHA" ]]; then
              echo "::error::Existing tag $TAG points to $TAG_SHA, expected $SOURCE_SHA."
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$SOURCE_SHA" -m "Project Wayfarer Plugins $TAG main-server handoff"
            git push origin "$TAG"
          fi

      - name: Publish GitHub release
        env:
          TAG: ${{ needs.build.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists."
            exit 1
          fi

          gh release create "$TAG" \
            "release/Wayfarer_Core-${TAG}.jar" \
            release/SHA256SUMS.txt \
            release/RELEASE_MANIFEST.md \
            release/DEPENDENCY_VERSIONS.toml \
            release/TEST_SERVER_EVIDENCE.md \
            release/MAIN_SERVER_INSTRUCTION.md \
            release/REQUIREMENT_TRACEABILITY.md \
            release/RELEASE_READINESS.md \
            --verify-tag \
            --latest \
            --title "Project Wayfarer Plugins $TAG" \
            --notes-file release/RELEASE_NOTES.md
